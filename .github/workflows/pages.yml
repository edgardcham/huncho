name: pages
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/site/package-lock.json
      # The root install gives typedoc the compiler options and @types/node the sources need.
      - run: npm ci
      - run: npm ci --prefix docs/site
      - run: npm run build --prefix docs/site
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
